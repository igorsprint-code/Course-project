- name: Install_nginx
  ansible.builtin.package:
    name: nginx
    update_cache: true

- name: enable nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: yes 


- name: configure nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: restart nginx
      

- name: edit starting page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.nginx-debian.html
  notify: restart nginx

- name: read access.log
  ansible.builtin.command: chmod +r /var/log/nginx/access.log

- name: read error.log
  ansible.builtin.command: chmod +r /var/log/nginx/error.log

  